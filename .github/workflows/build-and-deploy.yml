name: Build & Publish custom apk repo

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "release channel"
        required: true
        type: choice
        options:
          - stable
          - beta
        default: stable

  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: write

env:
  CHANNEL: ${{ github.event_name == 'schedule' && 'beta' || (inputs.channel || 'stable') }}
  PUBLISH_ROOT: public
  FEED_NAME: smartsafehub

  OPENWRT_REPO: Junatum/openwrt
  OPENWRT_REF: production

  SRC_SAFESHIELD_REPO: Junatum/safeshield
  SRC_SAFESHIELD_REF: main

  SRC_LUCI_REPO: Junatum/luci-app-safeshield
  SRC_LUCI_REF: main

  SRC_SMARTSAFEHUB_REPO: Junatum/luci-app-smartsafehub
  SRC_SMARTSAFEHUB_REF: main

  CUSTOM_PACKAGES: safeshield luci-app-safeshield luci-app-smartsafehub

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pages repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Select source refs by channel
        run: |
          set -eux

          if [ "${CHANNEL}" = "beta" ]; then
            ref="develop"
          else
            ref="main"
          fi

          echo "SRC_SAFESHIELD_REF=${ref}" >> "$GITHUB_ENV"
          echo "SRC_LUCI_REF=${ref}" >> "$GITHUB_ENV"
          echo "SRC_SMARTSAFEHUB_REF=${ref}" >> "$GITHUB_ENV"

      - name: Checkout OpenWrt
        uses: actions/checkout@v7
        with:
          repository: ${{ env.OPENWRT_REPO }}
          ref: ${{ env.OPENWRT_REF }}
          path: openwrt
          fetch-depth: 1
          submodules: false

      - name: Checkout SafeShield source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SRC_SAFESHIELD_REPO }}
          ref: ${{ env.SRC_SAFESHIELD_REF }}
          path: src/safeshield
          fetch-depth: 1
          submodules: false

      - name: Checkout LuCI app source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SRC_LUCI_REPO }}
          ref: ${{ env.SRC_LUCI_REF }}
          path: src/luci-app-safeshield
          fetch-depth: 1
          submodules: false

      - name: Checkout SmartSafeHub LuCI app source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SRC_SMARTSAFEHUB_REPO }}
          ref: ${{ env.SRC_SMARTSAFEHUB_REF }}
          path: src/luci-app-smartsafehub
          fetch-depth: 1
          submodules: false

      - name: Cache OpenWrt downloads
        uses: actions/cache@v5
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ runner.os }}-${{ env.OPENWRT_REF }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gawk \
            git \
            gettext \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            unzip \
            file \
            wget \
            curl \
            ca-certificates \
            zlib1g-dev \
            perl \
            cmake

      - name: Prepare OpenWrt feeds and packages
        run: |
          set -eux

          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          for pkg in ${CUSTOM_PACKAGES}; do
            rm -rf "package/${pkg}"
            rsync -a --delete "${GITHUB_WORKSPACE}/src/${pkg}/" "package/${pkg}/"
            test -f "package/${pkg}/Makefile"
          done

      - name: Pack prepared workspace
        run: |
          set -eux

          tar -cpf prepared-openwrt-workspace.tar openwrt

      - name: Upload prepared workspace
        uses: actions/upload-artifact@v7
        with:
          name: prepared-openwrt-workspace
          path: prepared-openwrt-workspace.tar
          if-no-files-found: error
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_dir: x86_64
            target: x86
            subtarget: 64

          - arch_dir: aarch64_cortex-a53
            target: mediatek
            subtarget: filogic

          - arch_dir: mipsel_24kc
            target: ramips
            subtarget: mt7620

    env:
      ARCH_DIR: ${{ matrix.arch_dir }}

    steps:
      - name: Download prepared workspace
        uses: actions/download-artifact@v7
        with:
          name: prepared-openwrt-workspace
          path: .

      - name: Extract prepared workspace
        run: |
          set -eux

          tar -xpf prepared-openwrt-workspace.tar

      - name: Configure OpenWrt for apk
        run: |
          set -eux

          cd openwrt

          rm -f .config .config.old

          {
            echo "CONFIG_TARGET_${{ matrix.target }}=y"
            echo "CONFIG_TARGET_${{ matrix.target }}_${{ matrix.subtarget }}=y"
            echo "CONFIG_USE_APK=y"
            echo "CONFIG_SIGNED_PACKAGES=y"
            echo ""

            for pkg in ${CUSTOM_PACKAGES}; do
              echo "CONFIG_PACKAGE_${pkg}=m"
            done
          } > .config

          make defconfig

          grep -E 'CONFIG_USE_APK=|CONFIG_SIGNED_PACKAGES=|CONFIG_PACKAGE_(safeshield|luci-app-safeshield|luci-app-smartsafehub)=' .config || true

      - name: Build packages
        run: |
          set -eux

          cd openwrt

          make toolchain/install -j"$(nproc)" V=s
          make target/compile -j"$(nproc)" V=s

          for pkg in ${CUSTOM_PACKAGES}; do
            make "package/${pkg}/compile" -j"$(nproc)" V=s
          done

      - name: Stage apk repo output
        env:
          APK_PRIVATE_KEY_PEM: ${{ secrets.APK_PRIVATE_KEY_PEM }}
          APK_PUBLIC_KEY_PEM: ${{ secrets.APK_PUBLIC_KEY_PEM }}
        run: |
          set -eux

          cd openwrt

          out="${GITHUB_WORKSPACE}/${PUBLISH_ROOT}/${CHANNEL}/packages/${ARCH_DIR}/${FEED_NAME}"
          mkdir -p "${out}"

          rm -f \
            "${out}"/*.apk \
            "${out}/packages.adb" \
            "${out}/index.json" \
            "${out}/smartsafehub.pem"

          find_apk() {
            local pkg="$1"

            (
              find bin/packages -type f -name "${pkg}-*.apk" -print 2>/dev/null || true
              find bin/targets -type f -name "${pkg}-*.apk" -print 2>/dev/null || true
            ) | while read -r f; do
              stat -c '%Y %n' "$f" 2>/dev/null || true
            done | sort -nr | head -n1 | cut -d' ' -f2-
          }

          for pkg in ${CUSTOM_PACKAGES}; do
            echo "Collecting ${pkg} apk..."

            apk_path="$(find_apk "${pkg}")"

            if [ -z "${apk_path:-}" ]; then
              echo "ERROR: ${pkg} apk not found under bin/packages or bin/targets"
              echo "== Config =="
              grep -E 'CONFIG_PACKAGE_(safeshield|luci-app-safeshield|luci-app-smartsafehub)=' .config || true
              echo "== Built APKs =="
              (find bin/packages bin/targets -type f -name '*.apk' -print || true) | head -n 400 || true
              exit 1
            fi

            echo "Using: ${apk_path}"
            cp -av "${apk_path}" "${out}/"
          done

          cd "${out}"

          if [ -z "${APK_PRIVATE_KEY_PEM:-}" ]; then
            echo "ERROR: APK_PRIVATE_KEY_PEM GitHub secret is empty"
            exit 1
          fi

          if [ -z "${APK_PUBLIC_KEY_PEM:-}" ]; then
            echo "ERROR: APK_PUBLIC_KEY_PEM GitHub secret is empty"
            exit 1
          fi

          umask 077

          printf '%s\n' "${APK_PRIVATE_KEY_PEM}" > private-key.pem
          printf '%s\n' "${APK_PUBLIC_KEY_PEM}" > smartsafehub.pem

          chmod 600 private-key.pem
          chmod 644 smartsafehub.pem

          APK_BIN="${GITHUB_WORKSPACE}/openwrt/staging_dir/host/bin/apk"
          test -x "${APK_BIN}"

          "${APK_BIN}" mkndx \
            --root "${GITHUB_WORKSPACE}/openwrt" \
            --keys-dir "${out}" \
            --allow-untrusted \
            --sign private-key.pem \
            --output packages.adb \
            ./*.apk

          test -s packages.adb

          "${APK_BIN}" adbdump --format json packages.adb \
            | "${GITHUB_WORKSPACE}/openwrt/scripts/make-index-json.py" \
                -f apk \
                -a "${ARCH_DIR}" \
                - > index.json

          test -s index.json

          rm -f private-key.pem

          echo "== Published files =="
          find . -maxdepth 1 -type f -print | sort

      - name: Upload repo artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PUBLISH_ROOT }}-${{ matrix.arch_dir }}-${{ env.CHANNEL }}
          path: ${{ env.PUBLISH_ROOT }}/${{ env.CHANNEL }}/packages/${{ matrix.arch_dir }}/${{ env.FEED_NAME }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout pages repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Download all repo artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ env.PUBLISH_ROOT }}-*-${{ env.CHANNEL }}
          path: ${{ env.PUBLISH_ROOT }}_tmp
          merge-multiple: false

      - name: Merge artifacts into public
        run: |
          set -eux

          rm -rf "${PUBLISH_ROOT}"
          mkdir -p "${PUBLISH_ROOT}/${CHANNEL}/packages"

          for d in "${PUBLISH_ROOT}_tmp"/*; do
            [ -d "$d" ] || continue

            base="$(basename "$d")"
            arch="${base#${PUBLISH_ROOT}-}"
            arch="${arch%-${CHANNEL}}"

            dest="${PUBLISH_ROOT}/${CHANNEL}/packages/${arch}/${FEED_NAME}"
            mkdir -p "${dest}"

            rsync -a --delete "$d/." "${dest}/"
          done

          echo "== Final apk repo files =="
          find "${PUBLISH_ROOT}" -maxdepth 6 \( \
            -name '*.apk' \
            -o -name 'packages.adb' \
            -o -name 'index.json' \
            -o -name '*.pem' \
          \) -print | sort

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./${{ env.PUBLISH_ROOT }}
          keep_files: true
